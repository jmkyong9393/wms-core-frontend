name: Frontend PR Check

on:
  pull_request:
    branches:
      - main
  # 브랜치에서 게이트를 직접 돌려볼 수 있게 수동 실행을 허용한다.
  workflow_dispatch:

jobs:
  test:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint (ESLint)
        run: npm run lint
        
      - name: Test (Vitest)
        run: npm run test:run

      - name: Build Test
        run: npm run build
